<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta regresiva</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--c:#ffb347;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:Orbitron,"Segoe UI",monospace;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{height:100dvh}
body.d{--c:#39ff6a}
canvas{position:fixed;inset:0;width:100%;height:100%}
main{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;text-shadow:0 0 12px #000a}
h1{margin:0;font-size:.5rem;letter-spacing:.35em;font-weight:500;opacity:.8}
h2{margin:0;font-size:.8rem;font-weight:800;letter-spacing:.1em;color:var(--c);transition:color 4s;text-shadow:0 0 8px var(--c)}
.t{display:flex;gap:6px}
.b{min-width:40px;padding:4px 5px;text-align:center;border:1px solid var(--c);border-radius:6px;background:#0005;transition:border-color 4s,box-shadow 4s}
body.d .b{box-shadow:0 0 10px #39ff6a55}
.b b{display:block;font-size:1.2rem;font-weight:800;color:var(--c);transition:color 4s;text-shadow:0 0 8px var(--c);font-variant-numeric:tabular-nums}
.b i{font-style:normal;font-size:.5rem;letter-spacing:.15em;opacity:.8}
#s{font-size:.5rem;letter-spacing:.2em;color:var(--c);transition:color 4s}
#op{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:6}
#op button{font:inherit;font-size:.55rem;letter-spacing:.18em;color:#fff;background:#000a;border:1px solid var(--c);border-radius:6px;padding:6px 10px;cursor:pointer;backdrop-filter:blur(6px);transition:border-color 4s,box-shadow .3s}
#ob{position:relative;color:var(--c)!important;transition:color 4s,border-color 4s}
#ob span{display:inline-block;transition:transform .7s cubic-bezier(.2,1.4,.3,1)}
#op.o #ob span{transform:rotate(180deg)}
#ob::after{content:"";position:absolute;inset:-1px;border-radius:6px;border:1px solid var(--c);opacity:0;pointer-events:none}
#op.o #ob::after{animation:ring .8s ease-out}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.8,2.8)}}
#ob.p{animation:pl 1.8s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 14px 1px var(--c)}}
#om{display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
#om button{opacity:0;transform:translateX(46px) scale(.3);filter:blur(6px);transition:opacity .35s,transform .55s cubic-bezier(.2,1.5,.3,1),filter .4s,border-color 4s}
#op.o #om{pointer-events:auto}
#op.o #om button{opacity:1;transform:none;filter:none;transition-delay:var(--d,0s);animation:fl 1s ease-out var(--d,0s) both}
#om button:nth-child(1){--d:.05s}#om button:nth-child(2){--d:.17s}#om button:nth-child(3){--d:.29s}
@keyframes fl{0%{box-shadow:0 0 26px 4px var(--c);background:var(--c);color:#000}45%{background:#000a;color:#fff}100%{box-shadow:0 0 12px -3px var(--c)}}
@media(hover:none){#op button{font-size:.65rem;padding:9px 13px}}
@media(max-width:420px){.b{min-width:36px}.b b{font-size:1.05rem}}
#chatb{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:6;font:inherit;font-size:.6rem;letter-spacing:.18em;color:var(--c);background:#000a;border:1px solid var(--c);border-radius:6px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(6px);transition:color 4s,border-color 4s}
@media(hover:none){#chatb{font-size:.7rem;padding:11px 15px}}
#chat{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:min(340px,calc(100vw - 20px));height:min(55dvh,420px);display:none;flex-direction:column;background:#000b;border:1px solid var(--c);border-radius:12px;backdrop-filter:blur(8px);z-index:5;font-family:system-ui,"Segoe UI",sans-serif;transition:border-color 4s}
#chat.o{display:flex}
#ch{padding:7px 10px;font-size:.65rem;letter-spacing:.15em;color:var(--c);border-bottom:1px solid #fff2;transition:color 4s}
#ml{flex:1;overflow-y:auto;padding:8px 10px;font-size:.82rem;line-height:1.35;-webkit-overflow-scrolling:touch}
#ml p{margin:0 0 5px;overflow-wrap:anywhere}
#ml b{color:var(--c);transition:color 4s}
#cf{display:flex;gap:6px;padding:8px;border-top:1px solid #fff2}
#cf input{flex:1;min-width:0;font-size:16px;background:#0008;border:1px solid #fff4;color:#fff;border-radius:8px;padding:8px}
#cf button{font:inherit;font-size:.65rem;color:#000;background:var(--c);border:0;border-radius:8px;padding:0 12px;cursor:pointer;transition:background 4s}
</style></head><body>
